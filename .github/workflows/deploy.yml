name: Build and Deploy to Netcup

on:
  push:
    branches:
      - main  # oder master, je nach deinem Standard-Branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Bun installieren (dieses Projekt nutzt bun.lock)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Abhängigkeiten installieren und App bauen
      - name: Install dependencies & Build
        run: |
          bun install --frozen-lockfile
          bun run build

      # Gebauten Web-Ordner (.output/public) via FTPS (lftp) auf Netcup übertragen
      - name: Deploy to Netcup via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp --env-password -u "$FTP_USERNAME" "ftp://$FTP_SERVER" -e "
            set cmd:fail-exit yes;
            set net:max-retries 3;
            set ftp:ssl-force yes;
            set ftp:ssl-protect-data yes;
            mirror --reverse --verbose .output/public/ spincorrect.icken.eu/;
            bye
          "
