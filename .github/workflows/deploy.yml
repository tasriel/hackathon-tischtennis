name: Build and Deploy to Netcup

on:
  push:
    branches:
      - main  # oder master, je nach deinem Standard-Branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Bun installieren (dieses Projekt nutzt bun.lock)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Abhängigkeiten installieren und App bauen
      - name: Install dependencies & Build
        run: |
          bun install --frozen-lockfile
          bun run build

      # Gebauten Web-Ordner (.output/public) via FTP auf Netcup übertragen
      - name: Deploy to Netcup via SFTP
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: "" # Bleibt leer, wenn Passwort genutzt wird
          REMOTE_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_USER: ${{ secrets.FTP_USERNAME }}
          REMOTE_PORT: "22"
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SOURCE: ".output/public/"
          TARGET: "spincorrect.icken.eu/"
          EXCLUDE: "/.git*, /node_modules/"
