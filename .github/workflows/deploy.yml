name: Build and publish to deploy branch

on:
  push:
    branches:
      - main  # oder master, je nach deinem Standard-Branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # darf den deploy-Branch schreiben

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Bun installieren (dieses Projekt nutzt bun.lock)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Abhängigkeiten installieren und App bauen
      - name: Install dependencies & Build
        run: |
          bun install --frozen-lockfile
          bun run build

      # Gebauten Web-Ordner (.output/public) in den Branch "deploy" schreiben.
      # Plesk (Netcup) holt diesen Branch per Webhook ab und legt ihn in den Dokumentenstamm.
      - name: Publish build to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          publish_branch: deploy
